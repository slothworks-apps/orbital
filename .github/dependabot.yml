# Weekly version updates, grouped so a week brings a few pull requests
# rather than one per package. Security updates are switched on in the
# repository settings and arrive on their own, outside this schedule.
version: 2
updates:
  - package-ecosystem: npm
    # The root lockfile covers every workspace.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Orbital runs on Node 24 everywhere (Electron's built-in Node, the relay
    # image, CI); the types follow that line, not the newest Node.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: weekly
    # The relay runs on an LTS line of Node. A new major is not LTS when it
    # comes out, so moving to it is a deliberate change, not a weekly bump.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

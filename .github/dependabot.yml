# Security updates only. They are switched on in the repository settings and
# arrive as their own pull requests whenever an advisory hits a dependency.
# Routine version updates are off (`open-pull-requests-limit: 0`); upgrades
# are taken by hand, when there is a reason to.
version: 2
updates:
  - package-ecosystem: npm
    # The root lockfile covers every workspace.
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /relay
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

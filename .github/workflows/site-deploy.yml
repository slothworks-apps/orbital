name: Site deploy

# Builds the Astro site and deploys it to Cloudflare Workers static assets,
# bound to orbital.slothworks.io. Runs after every push to main that touches
# the site or what its demos import, and by hand. The one-time Cloudflare
# setup and the secrets this needs are in the runbook
# docs/ops/deploy-the-site.md.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/src/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @orbital/site
      - name: Deploy to Cloudflare Workers
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

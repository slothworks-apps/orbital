name: Attribution

# The commit-msg hook in .githooks/ refuses attribution in a commit
# message, but only where it is installed, and a PR description has no hook
# at all. This runs the same check over every commit in a pull request and
# over its description, again whenever the description is edited.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            .githooks/commit-msg "$RUNNER_TEMP/msg" || { echo "  in $sha"; status=1; }
          done
          exit $status
      - name: description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr"
          .githooks/commit-msg "$RUNNER_TEMP/pr"

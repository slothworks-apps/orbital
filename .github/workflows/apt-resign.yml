name: Sign the apt index again

# The apt repository's Release file carries a Valid-Until
# (scripts/apt-repo.mjs → APT_VALID_DAYS); apt refuses an index past it.
# Every release signs it again, and this does once a month between releases,
# so servers never see it expire. Nothing is built or added: the bucket's
# Packages file is signed as it is. Run it by hand (Actions → Sign the apt
# index again → Run workflow) after a missed month. GitHub turns schedules
# off in a repository with no activity for 60 days; the runbook
# run-orbital-on-an-ubuntu-server says how to tell and what to do.
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions: {}

# Never at the same time as a release, which writes the same files.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check the secrets are there
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in APT_GPG_PRIVATE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (runbook run-orbital-on-an-ubuntu-server)"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The same uploads as release.yml's deb-publish, minus the pool.
      - name: Sign the index again and upload it
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          s3() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
          bucket="s3://$R2_BUCKET"
          index=dists/stable/main/binary-amd64
          current="$RUNNER_TEMP/Packages"
          repo="$RUNNER_TEMP/repo"
          if ! s3 cp "$bucket/$index/Packages" "$current"; then
            if aws s3api --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
                head-object --bucket "$R2_BUCKET" --key "$index/Packages" >/dev/null 2>&1; then
              echo "::error::Could not read the repository's Packages file."
              exit 1
            fi
            echo "::notice::The repository has no release yet; nothing to sign."
            exit 0
          fi
          node scripts/apt-repo.mjs resign --packages "$current" --out "$repo"
          s3 cp "$repo/$index/by-hash" "$bucket/$index/by-hash" --recursive \
            --cache-control 'public, max-age=31536000, immutable'
          for f in Packages Packages.gz; do
            s3 cp "$repo/$index/$f" "$bucket/$index/$f" --cache-control 'no-cache'
          done
          for f in Release Release.gpg InRelease; do
            s3 cp "$repo/dists/stable/$f" "$bucket/dists/stable/$f" --cache-control 'no-cache'
          done

      - name: Check the repository answers with the new index
        run: |
          version="$(curl -fsS https://apt.slothworks.io/dists/stable/main/binary-amd64/Packages | awk '/^Version: /{v=$2} END{print v}')"
          for _ in 1 2 3 4 5 6; do
            node scripts/apt-repo.mjs --check "$version" && exit 0
            sleep 30
          done
          echo "::error::apt.slothworks.io does not answer with a valid index"
          exit 1

name: Sign the apt index again

# The apt repository's Release file carries a Valid-Until
# (scripts/apt-repo.mjs → APT_VALID_DAYS); apt refuses an index past it.
# Every release signs its suite again, and this does once a month between
# releases, so servers never see it expire. It signs both suites, `stable`
# and `experimental` (ADR a-release-reaches-experimental-before-stable).
# Nothing is built or added: the bucket's Packages file is signed as it is;
# a suite with none yet gets an empty signed index, so a server switched to
# it reads an empty suite rather than a missing one. Run it by hand
# (Actions → Sign the apt index again → Run workflow) after a missed month. GitHub turns schedules
# off in a repository with no activity for 60 days; the runbook
# run-orbital-on-an-ubuntu-server says how to tell and what to do.
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions: {}

# Never at the same time as a release, which writes the same files.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check the secrets are there
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws configure set default.s3.addressing_style path
          missing=""
          for name in APT_GPG_PRIVATE_KEY S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (runbook run-orbital-on-an-ubuntu-server)"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The same uploads as release.yml's deb-publish, minus the pool.
      - name: Sign both suites again and upload them
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws configure set default.s3.addressing_style path
          s3() { aws s3 --endpoint-url "$S3_ENDPOINT" "$@"; }
          bucket="s3://$S3_BUCKET"
          for suite in stable experimental; do
            index="dists/$suite/main/binary-amd64"
            current="$RUNNER_TEMP/Packages-$suite"
            repo="$RUNNER_TEMP/repo-$suite"
            if ! answer="$(aws s3api head-object --endpoint-url "$S3_ENDPOINT" \
                --bucket "$S3_BUCKET" --key "$index/Packages" 2>&1)"; then
              if printf '%s' "$answer" | grep -q '(404)'; then
                echo "::notice::The $suite suite has no Packages file yet; signing an empty index."
                current=-
              else
                echo "$answer"
                echo "::error::Could not ask for the $suite suite's Packages file."
                exit 1
              fi
            else
              s3 cp "$bucket/$index/Packages" "$current"
              [ -s "$current" ] || current=-
            fi
            node scripts/apt-repo.mjs resign --suite "$suite" --packages "$current" --out "$repo"
            s3 cp "$repo/$index/by-hash" "$bucket/$index/by-hash" --recursive \
              --cache-control 'public, max-age=31536000, immutable'
            for f in Packages Packages.gz; do
              s3 cp "$repo/$index/$f" "$bucket/$index/$f" --cache-control 'no-cache'
            done
            for f in Release Release.gpg InRelease; do
              s3 cp "$repo/dists/$suite/$f" "$bucket/dists/$suite/$f" --cache-control 'no-cache'
            done
          done

      - name: Check the repository answers with the new indexes
        run: |
          for suite in stable experimental; do
            ok=
            for _ in 1 2 3 4 5 6; do
              if node scripts/apt-repo.mjs --valid --suite "$suite"; then ok=1; break; fi
              sleep 30
            done
            if [ -z "$ok" ]; then
              echo "::error::apt.slothworks.io does not answer with a valid $suite index"
              exit 1
            fi
          done

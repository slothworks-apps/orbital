name: Release macOS

# Builds, signs and notarizes the DMG for the version in desktop/package.json,
# and attaches it to a draft release that is published by hand. Started by
# hand only; the secrets it needs are listed in the runbook
# docs/ops/run-the-desktop-app.md → "Releasing from GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Read the version
        id: version
        run: echo "tag=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse a version that is already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release $TAG already exists. Bump desktop/package.json first."
            exit 1
          fi

      - run: npm ci

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # The API key takes precedence over the keychain profile the `dist`
      # script sets, so the local release script runs unchanged.
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run desktop:release

      - name: Check Gatekeeper accepts it
        run: spctl -a -vv desktop/release/mac-arm64/Orbital.app 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"

      - name: Attach the DMG to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" desktop/release/*.dmg \
            --draft --target "$GITHUB_SHA" --title "Orbital ${TAG#v}" --generate-notes

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

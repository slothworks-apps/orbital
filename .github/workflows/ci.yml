name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI also runs for pull requests from forks; it only needs to read the code.
permissions:
  contents: read

jobs:
  changes:
    # Every job below runs only for the paths that can break it. A skipped
    # job reports no check of its own, so the ruleset on main requires only
    # `ci passed` at the end, which counts a skipped job as passed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.workspaces.outputs.list }}
      filters: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `root` reaches everything: the lockfile, the lint config and this
          # workflow. server's tests start a relay, and web reads the desktop
          # version from desktop/package.json.
          filters: |
            root: &root
              - package.json
              - package-lock.json
              - eslint.config.js
              - .github/workflows/ci.yml
            shared: &shared
              - *root
              - 'shared/**'
            server:
              - *shared
              - 'server/**'
              - 'relay/**'
            web: &web
              - *shared
              - 'web/**'
              - desktop/package.json
            desktop:
              - *shared
              - 'desktop/**'
            relay: &relay
              - *shared
              - 'relay/**'
            mobile:
              - *web
              - 'mobile/**'
            desktop-app:
              - *web
              - 'server/**'
              - 'desktop/**'
            relay-image: *relay
            # The Linux package: the server, its build script and the
            # package's own files; its version is the desktop's.
            deb:
              - *shared
              - 'server/**'
              - 'linux/**'
              - scripts/build-deb.mjs
              - scripts/apt-repo.mjs
              - scripts/release-plan.mjs
              - desktop/package.json
            mobile-bundle: *web
            site:
              - *shared
              - 'site/**'
              - 'web/src/**'
            scripts:
              - *root
              - 'scripts/**'
            docs:
              - .github/workflows/ci.yml
              - 'docs/**'
            dependencies:
              - '**/package.json'
              - package-lock.json
              - '.github/workflows/**'
      - id: workspaces
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          echo "list=$(jq -c 'map(select(IN("shared","server","web","desktop","relay","mobile")))' <<<"$CHANGES")" >> "$GITHUB_OUTPUT"

  check:
    # One job per workspace, so a red check names the workspace that broke.
    # It also keeps each lint run to one TypeScript program: `eslint .` over
    # every workspace at once outgrew the runner's default heap.
    name: check (${{ matrix.workspace }})
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w ${{ matrix.workspace }}
      - run: npx eslint ${{ matrix.workspace }}
      # web's `test` is vitest in watch mode, `test:run` the single run.
      # mobile's checks that the updater plugin's privacy patch applied
      # (mobile/scripts/plugin-privacy.test.mjs); `npm ci` applies it.
      - run: npm run ${{ matrix.workspace == 'web' && 'test:run' || 'test' }} -w ${{ matrix.workspace }}

  desktop-app:
    # Packages Orbital.app the way the release does, minus the Developer ID:
    # ad-hoc signed, not notarized, no DMG. It catches what typecheck cannot,
    # a resource electron-builder.yml names that the build no longer makes.
    name: build (desktop)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.filters), 'desktop-app')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w server
      - run: npm run build -w web
      - run: npm run build -w desktop
      # electron-builder skips signing in a pull request unless told not to,
      # and build/verify-signature.cjs then fails the build. An ad-hoc
      # signature needs no secret, so a fork's pull request is safe to sign.
      - working-directory: desktop
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npx electron-builder --mac --arm64 --dir -c.mac.identity=- -c.mac.notarize=false

  relay-image:
    # The image release.yml pushes once its version is bumped, built here
    # and thrown away.
    name: build (relay)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.filters), 'relay-image')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: relay/Dockerfile
          push: false
          cache-from: type=gha,scope=relay

  deb:
    # The Linux package release.yml ships, built and installed on the Ubuntu
    # it is built for, then run: the one place the server runs on real Linux
    # from the package (spec 2026-10-19-headless-server-design → The
    # package). It is installed from a local, signed repository made by
    # scripts/apt-repo.mjs with a key made here, so apt sees a candidate and
    # the root updater has a source to refresh. The server's tests already
    # run on Linux in `check (server)`.
    name: build (linux package)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.filters), 'deb')
    runs-on: ubuntu-22.04
    env:
      PORT: '4747'
      REPO: /srv/orbital-apt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # As release.yml builds it: no install scripts.
      - run: npm ci --ignore-scripts
      - run: npm run build -w server
      - run: node scripts/build-deb.mjs --out "$RUNNER_TEMP/deb"
      - run: dpkg-deb --info "$RUNNER_TEMP"/deb/orbital_*_amd64.deb

      - name: A local repository with the package, signed with a key made for this run
        run: |
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update && sudo apt-get install -y dpkg-dev; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "Orbital CI <ci@example.invalid>" ed25519 sign 1d
          APT_GPG_PRIVATE_KEY="$(gpg --batch --armor --export-secret-keys)" \
            node scripts/apt-repo.mjs add --deb "$(ls "$RUNNER_TEMP"/deb/orbital_*_amd64.deb)" --packages - --out "$RUNNER_TEMP/repo"
          sudo cp -r "$RUNNER_TEMP/repo" "$REPO"
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo cp "$REPO/orbital.gpg" /etc/apt/keyrings/orbital.gpg
          printf 'Types: deb\nURIs: file:%s\nSuites: stable\nComponents: main\nArchitectures: amd64\nSigned-By: /etc/apt/keyrings/orbital.gpg\n' "$REPO" \
            | sudo tee /etc/apt/sources.list.d/orbital.sources
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/orbital.sources \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y orbital
          orbital --help

      # The server under the bundled Node, as the unit starts it, on a port
      # and data dir of its own. Its apt read is done once the candidate
      # shows: the local repository lists the installed version.
      - name: Start the server by hand and ask it
        run: |
          version="$(cat /usr/lib/orbital/VERSION)"
          debversion="$(dpkg-query -W -f='${Version}' orbital)"
          data="$RUNNER_TEMP/orbital-data"
          ORBITAL_HEADLESS=1 ORBITAL_PORT="$PORT" ORBITAL_DATA_DIR="$data" \
            ORBITAL_MIGRATIONS_DIR=/usr/lib/orbital/server/drizzle \
            /usr/lib/orbital/node /usr/lib/orbital/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 60); do
            curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1 && break
            sleep 1
          done
          token="$(cat "$data/api-token")"
          ask() { curl -fsS -H "Authorization: Bearer $token" "http://127.0.0.1:$PORT$1"; }
          ask /api/health | jq -e --arg v "$version" '.app == "orbital" and .version == $v'
          for _ in $(seq 30); do
            ask /api/server/update | jq -e --arg v "$debversion" '.candidate == $v' >/dev/null && break
            sleep 1
          done
          ask /api/server/update | jq -e --arg v "$debversion" \
            '.packaged == true and .installed == $v and .candidate == $v and .updating == false'
          ORBITAL_PORT="$PORT" ORBITAL_DATA_DIR="$data" orbital status

      - name: The server's log
        if: always()
        run: |
          cat "$RUNNER_TEMP/server.log" || true
          kill "$SERVER_PID" 2>/dev/null || true

      # What a user runs after installing: the root steps through sudo, the
      # user unit with lingering, then the status. A second run changes nothing.
      - name: orbital setup
        run: |
          orbital setup
          orbital setup | tee "$RUNNER_TEMP/setup-again.log"
          grep -q 'nothing changed' "$RUNNER_TEMP/setup-again.log"
          test "$(cat /etc/orbital/user)" = "$(id -un)"
          test "$(stat -c '%U:%G %a' /var/lib/orbital)" = "root:root 755"
          test "$(stat -c '%U:%G %a' /var/lib/orbital/update)" = "$(id -un):root 700"
          systemctl is-active orbital-update.path

      # One request through the root updater, written as the user the way
      # the server writes it: the path unit starts the service, which takes
      # the request and runs apt to its end.
      - name: A request through the root updater
        run: |
          request=/var/lib/orbital/update/request
          date +%s > "$request"
          for _ in $(seq 180); do
            state="$(systemctl show orbital-update.service -p ActiveState --value)"
            ran="$(systemctl show orbital-update.service -p ExecMainExitTimestampMonotonic --value)"
            if [ ! -e "$request" ] && [ "$state" = inactive ] && [ "$ran" != 0 ]; then break; fi
            sleep 1
          done
          systemctl show orbital-update.service -p Result -p ExecMainStatus
          test ! -e "$request"
          test "$(systemctl show orbital-update.service -p Result --value)" = success
          test "$(systemctl show orbital-update.service -p ExecMainStatus --value)" = 0

      - name: The service's and the updater's logs
        if: always()
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)" journalctl --user -u orbital --no-pager || true
          sudo journalctl -u orbital-update.service --no-pager || true

      - name: Purge it
        run: |
          sudo apt-get purge -y orbital
          test ! -e /etc/orbital && test ! -e /var/lib/orbital && test ! -e /usr/bin/orbital

  mobile-bundle:
    # The web bundle the phone app wraps, and the guard that keeps three.js
    # out of it, which needs the built bundle and so is not in `check (web)`.
    # The native shells are not built here (ADR ci-runs-what-a-change-reaches).
    name: build (mobile)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.filters), 'mobile-bundle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:mobile -w web
      - run: npm run test:bundle -w web

  site:
    # The site is not in the check matrix: it has no `test` script, and its
    # typecheck is two programs (the Astro pages and the demo pages' own
    # tsconfig), not the matrix's single `npm run typecheck -w <workspace>`.
    name: build (site)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.filters), 'site')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @orbital/site
      - run: npm run typecheck -w @orbital/site
      - run: npx tsc -p site/demo/tsconfig.json --noEmit

  # The phone app's version is copied into package.json and the Xcode
  # project; a bump that misses a copy fails here, and so does a minimum
  # version above what the repo has reached. In a pull request, so does a
  # shipped version below the base branch's (ADR
  # a-shipped-version-never-goes-back). It reads a handful of files, so it
  # runs on every change rather than behind a filter.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: github.event_name != 'pull_request'
        run: node scripts/check-versions.mjs
      # The base branch as it is now, not as it was when the PR opened: the
      # checkout is the PR merged into it, so a bump that landed on the base
      # since then is already in both.
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          node scripts/check-versions.mjs --base "origin/$BASE_REF"

  scripts:
    # The root scripts' own tests: release-plan.mjs, which decides what
    # release.yml ships. Plain `node --test`; the scripts have no workspace.
    name: test (scripts)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.filters), 'scripts')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The OTA signing script zips with fflate; no install script is needed
      # to test it.
      - run: npm ci --ignore-scripts
      - run: node --test 'scripts/*.test.mjs'

  docs:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.filters), 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bunx @slothworks/atlas validate

  secrets:
    # The pre-commit hook scans only where gitleaks is installed, and
    # `--no-verify` or a fork skips it. This scans every commit in the pull
    # request with the same .gitleaks.toml. The binary rather than
    # gitleaks-action, which needs a paid licence in an organisation.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: scan the pull request's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --log-opts="$BASE..$HEAD" --redact --no-banner

  dependencies:
    # Refuses a pull request that adds a dependency, or an action, with a
    # known vulnerability.
    needs: changes
    if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.filters), 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  passed:
    # The one check the ruleset on main requires. A job skipped because its
    # paths did not change counts as passed; a failed or cancelled one does
    # not.
    name: ci passed
    if: always()
    needs: [changes, check, desktop-app, relay-image, deb, mobile-bundle, site, versions, scripts, docs, secrets, dependencies]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

name: Release

# Ships every app whose version has not shipped yet, and nothing else
# (spec 2026-10-08-builds-for-testers-design, ADR
# a-version-ships-once-from-one-workflow). `plan` asks where each version
# ships to; the jobs after it build and publish only what is missing:
#
#   mac         desktop/package.json  → a published GitHub Release v<version>
#   deb         desktop/package.json  → orbital <version> in the apt repository
#                                       at apt.slothworks.io, and its .deb on
#                                       the Release v<version> (deb builds,
#                                       deb-publish signs and uploads)
#   ota         mobile/package.json   → the phone's bundle <version> on Beam,
#                                       encrypted and signed
#   ios         build.gradle          → TestFlight, then the tag
#                                       mobile-ios-v<versionName>
#   android     build.gradle          → Play Internal testing, then the tag
#                                       mobile-android-v<versionName>
#   relay       relay/package.json    → ghcr.io/<owner>/orbital-relay:<version>
#
# A merge without a version bump ships nothing. Run it by hand (Actions →
# Release → Run workflow) to retry what an outage stopped; any later run
# retries a failed store job and leaves the other alone. A store refusing a
# build number it already has counts as shipped (scripts/store-duplicate.mjs),
# so a build that reached the store without its tag is recorded, not stuck.
# The secrets each job reads are in the runbooks run-the-desktop-app,
# build-the-ios-app, build-the-android-app, ship-the-phone-over-the-air and
# run-orbital-on-an-ubuntu-server.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Two releases never run over each other; a queued one runs after.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # A manual run from another branch would release unmerged code; every
    # other job needs this one, so they are skipped with it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      mac: ${{ steps.plan.outputs.mac }}
      deb: ${{ steps.plan.outputs.deb }}
      ota: ${{ steps.plan.outputs.ota }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
      relay: ${{ steps.plan.outputs.relay }}
      mac-version: ${{ steps.plan.outputs.mac-version }}
      deb-version: ${{ steps.plan.outputs.deb-version }}
      ota-version: ${{ steps.plan.outputs.ota-version }}
      ios-version: ${{ steps.plan.outputs.ios-version }}
      android-version: ${{ steps.plan.outputs.android-version }}
      relay-version: ${{ steps.plan.outputs.relay-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The package is public, but a login keeps the image lookup an answer
      # rather than an "unauthorized" should it ever not be.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Read-only use here: the bundle lookup on Beam.
          BEAM_UPLOAD_KEY: ${{ secrets.BEAM_UPLOAD_KEY }}
        run: node scripts/release-plan.mjs

  mac:
    needs: plan
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.mac-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      # The certificate goes into a keychain of our own, rather than through
      # CSC_LINK: electron-builder's temporary keychain failed to unlock on
      # the runner ("SecKeychainUnlock: passphrase not correct") in the first
      # release run. CSC_KEYCHAIN points electron-builder at this one.
      - name: Import the signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -hex 24)"
          echo "::add-mask::$kcpw"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$p12"
          security import "$p12" -k "$kc" -f pkcs12 -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$kc"
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      # The `dist` script builds with `--publish never`: on CI electron-builder
      # would otherwise publish on its own, and the release is made below.
      # The API key takes precedence over the keychain profile it sets.
      - name: Build, sign and notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run desktop:release

      - name: Check Gatekeeper accepts it
        run: spctl -a -vv desktop/release/mac-arm64/Orbital.app 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"

      # Uploaded as a draft and published once every file is there, so an
      # upload that fails half way leaves no published release without its
      # update feed. `plan` counts a draft as not shipped, and the next run
      # replaces it. Publishing writes the tag v<version> at this commit.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          case "$draft" in
            true) gh release delete "$tag" --yes ;;
            false) echo "::error::$tag is already published"; exit 1 ;;
          esac
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-plan.mjs notes "$VERSION" > "$notes"
          if [ -s "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" \
            desktop/release/*.dmg desktop/release/*.zip desktop/release/*.blockmap desktop/release/latest-mac.yml \
            --draft --target "$GITHUB_SHA" --title "Orbital $VERSION" "$@"
          gh release edit "$tag" --draft=false

      - name: Remove the API key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  deb:
    # The server for Ubuntu (spec 2026-10-19-headless-server-design → The
    # package, The apt repository), built here and published by
    # `deb-publish`. After `mac`, and only once the desktop's Release for the
    # same version is published, so a server is never offered a version with
    # no DMG; when `mac` was skipped because the DMG had shipped, the Release
    # is there and this runs; when it failed, this does not. Built from the
    # Release's tag, so the package is the server of that DMG, and on 22.04,
    # so its native modules load on 22.04 and 24.04. No secrets reach this
    # job: it runs npm, and only `deb-publish` signs and uploads.
    needs: [plan, mac]
    if: ${{ !cancelled() && needs.plan.outputs.deb == 'true' && needs.mac.result != 'failure' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      listed: ${{ steps.listed.outputs.listed }}
    env:
      TAG: v${{ needs.plan.outputs.mac-version }}
      VERSION: ${{ needs.plan.outputs.deb-version }}
    steps:
      - name: Check the desktop's release is published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" != false ]; then
            echo "::error::The Release $TAG is not published, so the package does not ship. A later run retries."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # A repository that lists the version already needs no new package:
      # `deb-publish` only signs its index again. One that cannot be asked
      # reads as not listed.
      - id: listed
        run: |
          if node scripts/apt-repo.mjs --check "$VERSION"; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
          else
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.listed.outputs.listed != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # No install scripts: the native modules' linux-x64 builds come in their
      # npm tarballs, and the package copies those.
      - if: steps.listed.outputs.listed != 'true'
        run: npm ci --ignore-scripts
      - if: steps.listed.outputs.listed != 'true'
        run: npm run build -w server
      - if: steps.listed.outputs.listed != 'true'
        run: node scripts/build-deb.mjs --out "$RUNNER_TEMP/deb"
      - if: steps.listed.outputs.listed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: ${{ runner.temp }}/deb/orbital_${{ env.VERSION }}_amd64.deb
          if-no-files-found: error
          retention-days: 7

  deb-publish:
    # Adds the package `deb` built to the repository, signs it, uploads it to
    # R2 and attaches the .deb to the Release. The only job that sees the
    # repository's key and the bucket's token, and it runs no npm: Node's
    # built-ins, gpg, dpkg-scanpackages and the AWS CLI. When `deb` found the
    # version listed, nothing is added: the index is signed again, which also
    # mends an upload that stopped half way.
    needs: [plan, deb]
    if: ${{ !cancelled() && needs.deb.result == 'success' }}
    runs-on: ubuntu-22.04
    # write: the .deb on the Release.
    permissions:
      contents: write
    env:
      TAG: v${{ needs.plan.outputs.mac-version }}
      VERSION: ${{ needs.plan.outputs.deb-version }}
      LISTED: ${{ needs.deb.outputs.listed }}
    steps:
      - name: Check the secrets are there
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in APT_GPG_PRIVATE_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (runbook run-orbital-on-an-ubuntu-server)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: env.LISTED != 'true'
        uses: actions/download-artifact@v8
        with:
          name: deb
          path: ${{ runner.temp }}/deb

      # The repository's current Packages file is read from the bucket, not
      # from apt.slothworks.io, which a cache may hold back; only new files
      # go up, in the order apt-repo.mjs names: the pool, the by-hash copies
      # and the Packages files, then the signed Release files. The checksum
      # settings are what R2 takes from the AWS CLI.
      - name: Add it to the repository
        id: add
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          command -v dpkg-scanpackages >/dev/null || { sudo apt-get update && sudo apt-get install -y dpkg-dev; }
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          s3() { aws s3 --endpoint-url "$endpoint" "$@"; }
          bucket="s3://$R2_BUCKET"
          index=dists/stable/main/binary-amd64
          current="$RUNNER_TEMP/Packages"
          if ! answer="$(aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" --key "$index/Packages" 2>&1)"; then
            if printf '%s' "$answer" | grep -q '(404)'; then
              echo "No Packages file yet: the repository's first release."
              : > "$current"
            else
              echo "$answer"
              exit 1
            fi
          else
            s3 cp "$bucket/$index/Packages" "$current"
          fi

          repo="$RUNNER_TEMP/repo"
          if [ "$LISTED" = true ]; then
            node scripts/apt-repo.mjs resign --packages "$current" --out "$repo"
            echo "added=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/apt-repo.mjs add --deb "$RUNNER_TEMP/deb/orbital_${VERSION}_amd64.deb" \
              --packages "$current" --out "$repo"
          fi

          if [ -d "$repo/pool" ]; then
            s3 cp "$repo/pool" "$bucket/pool" --recursive --cache-control 'public, max-age=31536000, immutable'
          fi
          s3 cp "$repo/$index/by-hash" "$bucket/$index/by-hash" --recursive \
            --cache-control 'public, max-age=31536000, immutable'
          for f in Packages Packages.gz; do
            s3 cp "$repo/$index/$f" "$bucket/$index/$f" --cache-control 'no-cache'
          done
          for f in Release Release.gpg InRelease; do
            s3 cp "$repo/dists/stable/$f" "$bucket/dists/stable/$f" --cache-control 'no-cache'
          done
          s3 cp "$repo/orbital.gpg" "$bucket/orbital.gpg" --cache-control 'no-cache'

      # The Release carries the pool's .deb: the one just added, or, when the
      # version was listed already and an earlier run did not attach it, the
      # copy in the bucket. A listed version's asset is never replaced.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ADDED: ${{ steps.add.outputs.added }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          deb="orbital_${VERSION}_amd64.deb"
          if [ "$ADDED" = true ]; then
            gh release upload "$TAG" "$RUNNER_TEMP/deb/$deb" --clobber
          elif ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$deb"; then
            aws s3 cp --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              "s3://$R2_BUCKET/pool/main/o/orbital/$deb" "$RUNNER_TEMP/$deb"
            gh release upload "$TAG" "$RUNNER_TEMP/$deb"
          fi

      # Through apt.slothworks.io, as `plan` asks next time; its cache may
      # take a moment to let the new index through.
      - name: Check the repository lists it
        run: |
          for _ in 1 2 3 4 5 6; do
            node scripts/apt-repo.mjs --check "$VERSION" && exit 0
            sleep 30
          done
          echo "::error::apt.slothworks.io does not list orbital $VERSION after the upload"
          exit 1

  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-latest
    # write: the tag mobile-ios-v<versionName> once TestFlight has the build.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # App Store Connect takes only builds made with a current SDK, and the
      # runner's default Xcode can lag behind the newest one it carries.
      - name: Select the newest released Xcode
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          pod --version

      - run: npm ci
      # The updater plugin carries no session text only with its patch, which
      # npm ci applies; this fails the build when it did not.
      - run: npm test -w @orbital/mobile

      - name: Write the Firebase config and the App Store Connect API key
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" > mobile/ios/App/App/GoogleService-Info.plist
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Signing and upload through the API key: with -allowProvisioningUpdates
      # Xcode fetches the certificate and the profile through it. The script
      # tries a failed export once more itself. When App Store Connect
      # refuses the build number as one it already has, the build is there:
      # counted as shipped, so the tag below is written.
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_KEY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          status=0
          npm run ios:release || status=$?
          if [ "$status" -ne 0 ]; then
            refusal="$(node scripts/store-duplicate.mjs ios mobile/ios/App/output/release/export.log)" || exit "$status"
            echo "::notice title=Already in TestFlight::App Store Connect already has this build, counted as shipped: $refusal"
          fi

      - name: Remove the secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" mobile/ios/App/App/GoogleService-Info.plist

      # The record that iOS has this version; `plan` reads it.
      - name: Tag mobile-ios-v${{ needs.plan.outputs.ios-version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.ios-version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/mobile-ios-v$VERSION" -f sha="$GITHUB_SHA"

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    # write: the tag mobile-android-v<versionName> once Play has the build.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # JAVA_HOME from here is JDK 21, which mobile/scripts/android-env.sh
      # keeps; ANDROID_HOME is preset on the runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # The updater plugin carries no session text only with its patch, which
      # npm ci applies; this fails the build when it did not.
      - run: npm test -w @orbital/mobile

      # The paths build.gradle reads, all git-ignored.
      - name: Write the upload key, the Play service account and the Firebase config
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > secrets/orbital-upload.jks
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > secrets/keystore.properties
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > secrets/play-service-account.json
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json

      # Gradle's output goes to a log too (the `play` script runs it with
      # --stacktrace, which prints Play's own answer). When Play refuses the
      # version code as one it already has, the build is there: counted as
      # shipped, so the tag below is written.
      - name: Build and upload to Internal testing
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/android-release.log"
          status=0
          npm run android:release 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ]; then
            refusal="$(node scripts/store-duplicate.mjs android "$log")" || exit "$status"
            echo "::notice title=Already in Play::Google Play already has this version code, counted as shipped: $refusal"
          fi

      - name: Remove the secrets
        if: always()
        run: |
          rm -f secrets/orbital-upload.jks secrets/keystore.properties secrets/play-service-account.json \
            mobile/android/app/google-services.json

      # The record that Android has this version; `plan` reads it.
      - name: Tag mobile-android-v${{ needs.plan.outputs.android-version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.android-version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/mobile-android-v$VERSION" -f sha="$GITHUB_SHA"

  ota:
    # The phone's app version over the air (spec
    # 2026-10-09-phone-ota-updates-design → Releasing), apart from the store
    # jobs: when both run, the bundle still goes up — shells older than its
    # minNativeVersion are told to wait, new shells carry it built in.
    # `error` when Beam could not say whether the version is there: this job
    # then fails visibly, while the other apps still ship.
    needs: plan
    if: needs.plan.outputs.ota == 'true' || needs.plan.outputs.ota == 'error'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Stop when Beam could not be asked
        if: needs.plan.outputs.ota == 'error'
        run: |
          echo "::error::The plan could not ask Beam whether the phone's bundle is there; see the plan job. Re-run when Beam answers."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The web build asks whether each shell has its Firebase config
      # (vite.mobile.config.ts), and the store builds have both: without them
      # the bundle would never register for pushes.
      - name: Write the Firebase configs
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" > mobile/ios/App/App/GoogleService-Info.plist

      # The same build the store jobs put in the shell, and the same guard.
      - name: Build the phone's bundle
        run: |
          env -u ORBITAL_MOBILE_DEV npm run build:mobile -w @orbital/web
          npm run test:bundle -w @orbital/web

      # Signs, checks the result opens with mobile/ota-public-key.pem, uploads
      # with minNativeVersion = build.gradle's versionName and the version's
      # section of mobile/CHANGELOG.md as its notes. The private key exists
      # only in this step's environment: never on disk, never while npm or
      # the build ran.
      - name: Sign and upload to Beam
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
          BEAM_UPLOAD_KEY: ${{ secrets.BEAM_UPLOAD_KEY }}
        run: node scripts/ota-bundle.mjs

      - name: Remove the secrets
        if: always()
        run: |
          rm -f mobile/android/app/google-services.json mobile/ios/App/App/GoogleService-Info.plist

  relay-check:
    # The relay ships as a Linux image, so unlike ci.yml it is tested on Linux.
    needs: plan
    if: needs.plan.outputs.relay == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspace shared --workspace relay --include-workspace-root=false
      - run: npm run typecheck -w relay
      - run: npm test -w relay

  relay:
    # Nothing is deployed from here; the runbook run-the-relay covers pulling
    # the image.
    needs: [plan, relay-check]
    if: needs.plan.outputs.relay == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/orbital-relay
          # This job runs only for a version not yet in GHCR, so the version
          # tag is written once and never moves; `latest` moves only to a new
          # version.
          tags: |
            type=raw,value=${{ needs.plan.outputs.relay-version }}
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: relay/Dockerfile
          push: true
          # A plain image manifest, without an attestation index, so every
          # tag pulls directly.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

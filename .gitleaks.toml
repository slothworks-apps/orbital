# Gitleaks, run by the pre-commit hook in .githooks/. The default rules,
# plus the made-up values the tests use as stand-ins for real secrets.
[extend]
useDefault = true

[[allowlists]]
description = "stand-in secrets in tests"
# Both must hold: a real secret pasted into a test is still caught.
condition = "AND"
paths = ['''^server/test/''']
regexes = ['''^ghp_secret123$''', '''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "CocoaPods' podspec checksums, flagged when a pod's name holds 'Key'"
condition = "AND"
paths = ['''^mobile/ios/App/Podfile\.lock$''']
regexes = ['''^[0-9a-f]{40}$''']

[[allowlists]]
description = "the browser extension's manifest key: a public key that fixes its ID"
condition = "AND"
paths = ['''^browser-extension/static/manifest\.json$''']
regexes = ['''^MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA21/elqNcZXQmQ7C07WhQ''']

apply plugin: 'com.android.application'
apply plugin: 'com.github.triplet.play'

// The upload key for Google Play (runbook build-the-android-app → Release to Google Play).
// It lives in the git-ignored secrets/ at the repo root, never in the project.
def keystorePropertiesFile = rootProject.file('../../secrets/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The Play service account that uploads releases, in the same git-ignored secrets/.
def playServiceAccountFile = rootProject.file('../../secrets/play-service-account.json')

android {
    namespace = "io.slothworks.orbital.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.slothworks.orbital.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "0.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            upload {
                storeFile rootProject.file("../../secrets/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// `npm run android:release` uploads the bundle to the Internal testing track,
// rolled out at once, as `ios:release` sends iOS to TestFlight. Production
// stays a hand-made release in the Console. A draft app (never rolled out)
// takes only draft releases: `-PplayStatus=draft`.
play {
    serviceAccountCredentials.set(playServiceAccountFile)
    track.set('internal')
    defaultToAppBundles.set(true)
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.valueOf(
        (project.findProperty('playStatus') ?: 'completed').toString().toUpperCase()))
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The bundle for Play carries its version in its name; the debug APK keeps
// Gradle's name, which the runbook's install commands use. A copy, not a
// rename: the Play upload reads the bundle at Gradle's own path.
tasks.matching { it.name == 'bundleRelease' }.configureEach {
    doLast {
        def dir = file("$buildDir/outputs/bundle/release")
        def versioned = new File(dir, "orbital-${android.defaultConfig.versionName}.aab")
        java.nio.file.Files.copy(new File(dir, 'app-release.aab').toPath(), versioned.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

// Play refuses an unsigned bundle; say why here instead of after the upload.
gradle.taskGraph.whenReady { graph ->
    if (!keystorePropertiesFile.exists() && graph.allTasks.any { it.name == 'bundleRelease' }) {
        throw new GradleException("No upload key: ${keystorePropertiesFile} is missing (runbook build-the-android-app).")
    }
    if (!playServiceAccountFile.exists() && graph.allTasks.any { it.name.startsWith('publish') }) {
        throw new GradleException("No Play service account: ${playServiceAccountFile} is missing (runbook build-the-android-app → Upload from the command line).")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

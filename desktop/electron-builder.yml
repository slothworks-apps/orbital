appId: io.slothworks.orbital
productName: Orbital
# Fails the build when signing was skipped — electron-builder only warns.
afterSign: build/verify-signature.cjs
directories:
  output: release
# Where an installed app looks for updates (ADR the-desktop-app-updates-itself).
# Off here, so a build from the repository — `dist:local`, `dist:self` — carries
# no app-update.yml and never replaces itself with a published release; only
# the release build's `dist` script turns it on, with the repository on
# GitHub. `null` has to be the default rather than the override: on the
# command line `-c.publish=null` arrives as the string "null", which
# electron-builder reads as the name of a publisher and fails on.
publish: null
files:
  - dist/**
  - package.json
  # The SDK's platform package is the 200 MB `claude` binary. Orbital spawns
  # the user's own CLI instead (spec 2026-09-16-electron-wrapper-design § 2),
  # and npm workspace hoisting puts this in the ROOT node_modules, so the
  # pattern has to match at any depth.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**"
extraResources:
  # The paths desktop/src/main.ts resolves against `process.resourcesPath`.
  - from: ../server/dist/index.mjs
    to: server/index.mjs
  - from: ../server/drizzle
    to: drizzle
  - from: ../web/dist
    to: web
  # The menu bar's template image, both scales — `nativeImage` looks the @2x
  # file up beside the 1x one, so it has to land in the same directory.
  # Regenerate them with build/make-icon.sh if the artwork changes.
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  # The server bundle's runtime externals. It is forked from
  # Resources/server/, and Node resolution walks up from there — it never
  # reaches app.asar/node_modules — so the packages have to sit beside it.
  - from: ../node_modules/better-sqlite3
    to: server/node_modules/better-sqlite3
    filter:
      # Only the one prebuild this target can load; `deps/` and `src/` are the
      # sqlite amalgamation, needed to compile the addon and never to run it.
      - "**/*"
      - "!deps/**"
      - "!src/**"
      - "!build/**"
      - "!prebuilds/**"
      - "prebuilds/darwin-arm64.node"
  - from: ../node_modules/@anthropic-ai/claude-agent-sdk
    to: server/node_modules/@anthropic-ai/claude-agent-sdk
  # The terminals' pty (spec 2026-10-05-embedded-terminal-design § Packaging):
  # the JS, and the one prebuild with its `spawn-helper`, which forks every
  # shell and has to stay executable. `node-addon-api` is only headers for a
  # build from source, which never happens here.
  - from: ../node_modules/node-pty
    to: server/node_modules/node-pty
    filter:
      - package.json
      - LICENSE
      - lib/**
      - "!lib/**/*.map"
      - prebuilds/darwin-arm64/**
mac:
  # electron-builder's default lookup is build/icon.icns already; set here
  # anyway so it isn't implicit. Regenerate with build/make-icon.sh if the
  # favicon artwork changes.
  icon: build/icon.icns
  # The DMG is the first install; Squirrel.Mac installs every update after it
  # from the ZIP.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # Developer ID, named explicitly (ADR desktop-app-is-developer-id-signed).
  # macOS keys privacy grants (Downloads, Documents, media…) to the signing
  # identity; an ad-hoc signature changed with every build, so each update
  # asked for them all over again. Left unset, electron-builder could fall
  # back to the keychain's Apple Development certificate, which is not a
  # distribution identity. Notarization runs when APPLE_KEYCHAIN_PROFILE is
  # set, which the `dist` script does.
  identity: "SlothWorks s.r.o. (XTAS72W86T)"
  hardenedRuntime: true
  # The prompts name Orbital, but what asks is a Claude session it runs: the
  # CLI and every command it spawns are Orbital's children, so macOS charges
  # their file access to Orbital.app.
  extendInfo:
    NSDownloadsFolderUsageDescription: A Claude session you run from Orbital wants to read or write files in Downloads.
    NSDocumentsFolderUsageDescription: A Claude session you run from Orbital wants to read or write files in Documents.
    NSDesktopFolderUsageDescription: A Claude session you run from Orbital wants to read or write files on the Desktop.
    NSRemovableVolumesUsageDescription: A Claude session you run from Orbital wants to read or write files on a removable volume.
    NSNetworkVolumesUsageDescription: A Claude session you run from Orbital wants to read or write files on a network volume.
    NSAppleMusicUsageDescription: A Claude session you run from Orbital touched your media library. Orbital itself never needs it.
